<app-loader [isLoading]="isLoading"></app-loader>

<div class="login-page">
  <mat-card class="login-card" [@cardAnim]>

    <!-- HEADER -->
    <div class="login-header">
              <img src="assets/images/logo-with-name.png" alt="Cargo-Setu Logo" class="login-logo" />
      <p>Transport Business, Ab Digital!!</p>
    </div>

    <mat-tab-group mat-stretch-tabs (selectedTabChange)="onTabChange()">

      <!-- EMAIL LOGIN -->
      <mat-tab label="Email">
        <form #loginForm="ngForm" (ngSubmit)="loginWithEmail()" class="form">

          <mat-form-field appearance="outline" class="full">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="credential.email" name="email" required
              (blur)="checkEmailExists()" (ngModelChange)="userExists = null">
          </mat-form-field>
          <small class="error-msg" *ngIf="checkingEmail">Checking...</small>
          <small class="error-msg" *ngIf="userExists === false">
            No account found with this email.
            <a style="cursor:pointer; text-decoration:underline;" (click)="goToSignup()">Sign up instead?</a>
          </small>

          <mat-form-field appearance="outline" class="full" *ngIf="userExists !== false">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="credential.password"
              name="password" required>
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <button mat-raised-button color="primary" class="btn" [disabled]="loginForm.invalid || userExists === false">Login</button>
        </form>
        <!-- <a href=""></a> -->
        <button class="mat-mdc-stroked-button google-btn">
          <span class="mdc-button__label">
             <a href="/signup">Don't have an account?</a>
          </span>
        </button>
      </mat-tab>

      <!-- OTP LOGIN -->
      <mat-tab label="OTP">

        <!-- STEP 1: MOBILE -->
        <form *ngIf="!otpSent" (ngSubmit)="sendOtp()" class="form">

          <div class="mobile-field-container">
            <mat-form-field appearance="outline" class="mobile-code-field">
              <mat-label>Code</mat-label>
              <mat-select [(ngModel)]="otp.mobileCode" name="mobileCode" (selectionChange)="onMobileCodeChange()">
                <mat-option *ngFor="let c of countryCodes" [value]="c.code">
                  {{ c.flag }} {{ c.code }}
                </mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="mobile-number-field">
              <mat-label>Mobile Number</mat-label>
              <input matInput type="tel" [(ngModel)]="otp.mobile" name="mobile" required
                [placeholder]="mobilePlaceholder" (input)="onMobileInput($event)"
                [maxLength]="mobileDigits" inputmode="numeric">
            </mat-form-field>
          </div>

          <button mat-raised-button color="primary" class="btn">
            Send OTP
          </button>
        </form>

        <!-- STEP 2: OTP VERIFY -->
        <form *ngIf="otpSent" (ngSubmit)="verifyOtp()" class="form fade-in">

          <mat-form-field appearance="outline" class="full">
            <mat-label>Enter OTP</mat-label>
            <input matInput maxlength="6" [(ngModel)]="otp.code" name="otp" required>
          </mat-form-field>

          <button mat-raised-button color="primary" class="btn">
            Verify & Login
          </button>

          <a class="resend" (click)="sendOtp()">Resend OTP</a>

        </form>
        <!-- BELOW LOGIN BUTTON -->
        <div class="divider">
          <span>OR</span>
        </div>

        <div id="googleSignInDiv" class="google-btn"></div>

      </mat-tab>

    </mat-tab-group>
  </mat-card>
</div>
