<div class="confirm-dialog">
  <h2>{{ data.title || 'Confirm Action' }}</h2>
  <p>{{ data.message || 'Are you sure you want to continue?' }}</p>
  <div class="confirm-actions">
    <button mat-button class="btn-cancel" (click)="onCancel()">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button mat-raised-button class="btn-confirm" [class.btn-danger]="variant === 'danger'" [class.btn-primary]="variant === 'primary'" (click)="onConfirm()">
      {{ data.confirmText || 'Delete' }}
    </button>
  </div>
</div>
