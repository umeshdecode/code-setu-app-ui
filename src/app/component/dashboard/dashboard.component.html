<section class="dashboard-page">
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">Dashboard</p>
            <h1>Workspace</h1>
        </div>
    </header>

    <div class="stat-grid" *ngIf="stats.length > 0">
        <article class="stat-card" *ngFor="let stat of stats" [ngClass]="'tone-' + stat.tone">
            <span class="stat-icon">
                <mat-icon>{{ stat.icon }}</mat-icon>
            </span>
            <div class="stat-body">
                <span class="stat-label">{{ stat.label }}</span>
                <span class="stat-value skeleton" *ngIf="stat.loading"></span>
                <span class="stat-value unavailable" *ngIf="!stat.loading && stat.failed">&mdash;</span>
                <span class="stat-value" *ngIf="!stat.loading && !stat.failed">{{ stat.value }}</span>
            </div>
        </article>
    </div>

    <ng-container *ngIf="dashboardSections.length > 0; else emptyDashboard">
        <section class="module-section" *ngFor="let section of dashboardSections">
            <div class="section-title">
                <mat-icon>{{ section.icon }}</mat-icon>
                <h2>{{ section.label }}</h2>
            </div>

            <div class="module-grid">
                <button
                    type="button"
                    class="module-card"
                    [class.coming-soon]="item.comingSoon"
                    [ngClass]="'accent-' + (item.accent || 'blue')"
                    *ngFor="let item of section.items"
                    (click)="openModule(item)">
                    <span class="icon-wrapper">
                        <mat-icon>{{ item.icon }}</mat-icon>
                    </span>
                    <span class="card-title">{{ item.label }}</span>
                    <span class="card-subtitle">{{ item.subtitle }}</span>
                    <span class="soon-badge" *ngIf="item.comingSoon">Coming soon</span>
                </button>
            </div>
        </section>
    </ng-container>

    <ng-template #emptyDashboard>
        <div class="empty-state">
            <mat-icon>lock</mat-icon>
            <h2>No modules assigned</h2>
            <p>Please contact an administrator to update your role permissions.</p>
        </div>
    </ng-template>
</section>
