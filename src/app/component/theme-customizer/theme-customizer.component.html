<section class="theme-menu-panel" *ngIf="settings" (click)="keepMenuOpen($event)">
  <div class="theme-menu-title">
    <mat-icon>palette</mat-icon>
    <div>
      <h3>Theme</h3>
      <p>Appearance and font</p>
    </div>
  </div>

  <div class="field-group">
    <label>Mode</label>
    <div class="segmented-control">
      <label>
        <input type="radio" name="themeMode" [(ngModel)]="settings.mode" value="light" (change)="updateTheme()">
        <span>Light</span>
      </label>
      <label>
        <input type="radio" name="themeMode" [(ngModel)]="settings.mode" value="dark" (change)="updateTheme()">
        <span>Dark</span>
      </label>
      <label>
        <input type="radio" name="themeMode" [(ngModel)]="settings.mode" value="system" (change)="updateTheme()">
        <span>System</span>
      </label>
    </div>
  </div>

  <div class="field-group">
    <label>Accent colour</label>
    <div class="palette-strip">
      <button type="button" class="swatch" *ngFor="let swatch of paletteSwatches"
              [class.active]="settings.primaryColor === swatch.hex"
              [style.background]="swatch.hex"
              [attr.aria-pressed]="settings.primaryColor === swatch.hex"
              [title]="swatch.label + ' · ' + swatch.hex"
              (click)="selectPrimary(swatch.hex)">
        <mat-icon *ngIf="settings.primaryColor === swatch.hex">check</mat-icon>
      </button>
    </div>
  </div>

  <label class="select-field">
    <span>Font</span>
    <select [(ngModel)]="settings.fontFamily" (change)="updateTheme()">
      <option *ngFor="let font of fontOptions" [ngValue]="font.value">{{ font.label }}</option>
    </select>
  </label>

  <button type="button" class="reset-btn" (click)="resetTheme(); keepMenuOpen($event)">
    <span class="material-icons">restart_alt</span>
    Reset theme
  </button>
</section>
