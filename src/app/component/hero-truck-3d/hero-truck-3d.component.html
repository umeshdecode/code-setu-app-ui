<!-- The SVG is the FALLBACK, not a placeholder. It paints immediately (and is
     what the LCP measurement sees), then fades to opacity 0 once the canvas
     has drawn. It stays mounted so a lost WebGL context can fade back to it. -->
<svg class="lp-hero-art" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="lpDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="currentColor" />
    </pattern>
    <linearGradient id="lpRouteA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4663ac" stop-opacity="0" />
      <stop offset="45%" stop-color="#6f8fd8" stop-opacity="1" />
      <stop offset="100%" stop-color="#2fbf87" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="lpRouteB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2fbf87" stop-opacity="0" />
      <stop offset="60%" stop-color="#4663ac" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8fa9e0" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#lpDots)" class="lp-hero-dots" />

  <path class="lp-route lp-route-a" d="M-40 520 C 220 520, 260 300, 470 300 S 760 470, 900 380 S 1130 150, 1260 170"
        fill="none" stroke="url(#lpRouteA)" stroke-width="2.5" stroke-linecap="round" />
  <path class="lp-route lp-route-b" d="M-40 250 C 180 250, 300 120, 520 160 S 820 320, 1000 250 S 1180 190, 1260 220"
        fill="none" stroke="url(#lpRouteB)" stroke-width="2" stroke-linecap="round" />

  <circle class="lp-node" cx="470" cy="300" r="5" />
  <circle class="lp-node" cx="900" cy="380" r="5" />
  <circle class="lp-node" cx="520" cy="160" r="4" />
  <circle class="lp-node" cx="1000" cy="250" r="4" />
</svg>

<canvas #canvas class="lp-hero-canvas" aria-hidden="true"></canvas>
