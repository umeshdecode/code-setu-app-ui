events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Hides Nginx version on error pages
    server_tokens off;

    # Nothing was compressed before this. The landing page's lazy three.js
    # chunk is ~500 KB raw and ~140 KB gzipped, and main.js benefits just as
    # much. Brotli is not available in the openresty/openresty:alpine image.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain
               text/css
               application/javascript
               application/json
               image/svg+xml
               application/manifest+json
               font/woff2;

    server {
    listen 4200;
        server_name localhost;

        # SECURITY: Completely removes the 'Server' header banner
        # (This directive requires the OpenResty image)
        more_clear_headers Server;

        location / {
            # Use the OpenResty default path
            root /usr/local/openresty/nginx/html;
            index index.html index.htm;

            # CRITICAL: Fixes Angular routing 404s on page refresh
            try_files $uri $uri/ /index.html;
        }

        # Angular emits content-hashed filenames (outputHashing: "all"), so
        # these are safe to cache forever. index.html is deliberately NOT
        # matched here — it must stay revalidated or deploys never land.
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
            root /usr/local/openresty/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # nginx add_header does NOT inherit into a location that declares
            # its own, so the server-level security headers below must be
            # repeated here or they silently vanish for every matched file.
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
        }

        # Optional: Add security headers for 2026
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }
}
